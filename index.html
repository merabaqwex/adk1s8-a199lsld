<style>
/* Layout: tek sütun "yol haritası" → kurs → büyük düğmeli araba ekranı. Gece sürüşü için koyu, tek görünüm. */
:root{
  --bg:#111315; --surface:#1a1d20; --surface2:#22262a; --line:#30353a;
  --ink:#f2efe9; --mute:#a3a7ab; --dim:#6c7176;
  --rojo:#e4573d; --oro:#efb72f; --verde:#4fbf84;
  --display:"Bricolage Grotesque", ui-rounded, -apple-system, "Segoe UI", sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
header h1{font:800 22px/1.1 var(--display);margin:0;flex:1;min-width:0;letter-spacing:-.01em;text-wrap:balance}
.back{width:42px;height:42px;border-radius:12px;background:var(--surface2);font-size:24px;display:grid;place-items:center}
.stripe{width:26px;height:18px;border-radius:4px;flex:none;background:linear-gradient(var(--rojo) 0 25%,var(--oro) 25% 75%,var(--rojo) 75%)}
h2{font:700 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:26px 2px 10px}
.stack{display:flex;flex-direction:column;gap:10px}
.resume{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:20px;background:#2a1a15;border:1px solid #5a2e22}
.resume .ic{width:54px;height:54px;border-radius:50%;background:var(--rojo);display:grid;place-items:center;flex:none}
.resume small{display:block;color:#e8b3a3;font-size:13px}
.resume b{display:block;font:700 18px/1.25 var(--display);margin-top:2px}
.course{display:flex;gap:14px;text-align:left;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.course .n{width:46px;flex:none;border-radius:13px;display:grid;place-items:center;font:800 24px/1 var(--display);color:#111315}
.course .txt{flex:1;min-width:0}
.course b{font:700 19px/1.2 var(--display)}
.course p{margin:4px 0 10px;color:var(--mute);font-size:14px}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--verde)}
.meta{margin-top:6px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--mute);font-size:14px}
.note b{color:var(--ink)}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 14px}
.set{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set label{flex:1;font-size:15px}
.set label small{display:block;color:var(--dim);font-size:12px}
.set select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:56%}
.test{padding:9px 12px;border-radius:10px;background:var(--surface2);font-weight:600;font-size:14px}
.disc{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.disc-h{display:flex;align-items:center;gap:10px;padding:14px}
.disc-h b{font:700 18px/1 var(--display);flex:1}
.disc-h span{font-size:12px;color:var(--mute)}
.playall{padding:8px 12px;border-radius:11px;background:var(--rojo);color:#fff;font-weight:700;font-size:14px}
.trk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line);min-height:60px}
.trk .num{width:28px;flex:none;text-align:center;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.trk .t{flex:1;min-width:0}
.trk .t span{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .ck{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:900;color:#111315}
.trk .ck.on{background:var(--verde);border-color:var(--verde)}
.trk.now{background:#2a1d18}.trk.now .num{color:var(--rojo)}

#mini{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#mini .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:20px;background:#262b2f;border:1px solid #3c4247;box-shadow:0 10px 30px #000a;position:relative;overflow:hidden}
#mini .info{flex:1;min-width:0;text-align:left}
#mini b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini small{color:var(--mute);font-size:12px}
.pp{width:52px;height:52px;border-radius:50%;background:var(--rojo);display:grid;place-items:center;flex:none;color:#fff}
#mini .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--oro);width:0;transition:width .3s}

#car{position:fixed;inset:0;z-index:20;background:#0b0c0d;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(18px,env(safe-area-inset-left,0px))}
#car .top{display:flex;align-items:center;gap:10px}
#car .top .where{flex:1;min-width:0;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#car .close{width:48px;height:48px;border-radius:14px;background:var(--surface2);font-size:26px;flex:none}
#car .stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;min-height:0}
#car .lesson{color:var(--oro);font-weight:700;font-size:15px}
#car .es{font:800 clamp(30px,8.5vw,46px)/1.15 var(--display);letter-spacing:-.01em;text-wrap:balance;transition:color .2s}
#car .en{font-size:clamp(19px,5vw,24px);color:var(--mute);text-wrap:balance;transition:color .2s}
#car .es.speaking{color:var(--oro)} #car .en.speaking{color:var(--ink)}
#car .count{color:var(--dim);font-variant-numeric:tabular-nums;font-size:14px}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--verde)} .dots i.c{background:var(--oro)}
#car .ctrls{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:center}
#car .ctrls button{height:100px;border-radius:24px;background:var(--surface2);display:grid;place-items:center;color:var(--ink)}
#car .ctrls button span{display:block;font-size:12px;color:var(--mute);margin-top:4px}
#car .ctrls .big{height:132px;background:var(--rojo);color:#fff}
#car .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
#car .row2 button{height:60px;border-radius:18px;background:var(--surface);font-weight:700;font-size:16px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const RAW = `@ foundation | Foundation | 1 | Temel kurs: sıfırdan konuşmaya. Michel Thomas Foundation sırasını izler.
# CD 1
## -ible / -able kelimeleri
posible = possible
Es posible. = It is possible.
Es terrible. = It is terrible.
Es probable. = It is probable.
Es aceptable. = It is acceptable.
Es increíble. = It is incredible.
## para mí, para usted, no es
Es para mí. = It is for me.
Es para usted. = It is for you.
No es para usted. = It is not for you.
No es posible para mí. = It is not possible for me.
No es para mí, es para usted. = It is not for me, it is for you.
Es aceptable para usted. = It is acceptable for you.
## Soru tonlaması, ¿por qué?, así
¿Es posible? = Is it possible?
¿No es posible? = Isn't it possible?
¿Por qué? = Why?
porque = because
Es así. = It is like that.
No es así. = It is not like that.
¿Por qué no es posible así? = Why isn't it possible like that?
Lo siento, pero no es así. = I'm sorry, but it's not like that.
## -ente / -ante, muy bueno
importante = important
diferente = different
Es muy importante. = It is very important.
Es muy bueno. = It is very good.
No es muy diferente así. = It is not very different that way.
Es un restaurante muy bueno. = It is a very good restaurant.
## tengo, quiero, necesito
tengo = I have
Lo tengo. = I have it.
No lo quiero. = I don't want it.
Lo necesito ahora. = I need it now.
Lo quiero pero no lo necesito. = I want it but I don't need it.
No lo tengo ahora. = I don't have it now.
## tiene, ¿qué?
¿Qué tiene? = What do you have?
¿Lo tiene? = Do you have it?
No lo tiene. = You don't have it.
¿Qué tiene para mí? = What do you have for me?
Es urgente. Lo necesito ahora. = It's urgent. I need it now.
¿Por qué no lo tiene para mí? = Why don't you have it for me?
## quiere, saber
¿Qué quiere? = What do you want?
¿Lo quiere así? = Do you want it like that?
Quiero saber. = I want to know.
No quiero saber. = I don't want to know.
Quiero saber por qué. = I want to know why.
¿Por qué no lo quiere? = Why don't you want it?
## puedo, hacer, comer
puedo = I can
¿Puede hacerlo? = Can you do it?
Quiero comer algo. = I want to eat something.
Tengo hambre. = I am hungry.
¿Tiene hambre? = Are you hungry?
¿Qué quiere comer ahora? = What do you want to eat now?
## -ario kelimeleri, y
necesario = necessary
No es necesario. = It is not necessary.
Al contrario. = On the contrary.
Es necesario y es importante. = It is necessary and it is important.
No es necesario para mí ahora. = It is not necessary for me now.
## ver, verlo
ver = to see
Quiero verlo. = I want to see it.
No puedo verlo. = I can't see it.
¿Puede verlo? = Can you see it?
¿Quiere hacerlo ahora? = Do you want to do it now?
No puedo hacerlo así. = I can't do it that way.
## -encia / -ancia, esta noche
la diferencia = the difference
una preferencia = a preference
¿Qué diferencia? = What difference?
¿Tiene una preferencia? = Do you have a preference?
Es para esta noche. = It is for tonight.
No es importante esta noche. = It's not important tonight.
## ¿dónde?, cenar, -ción
¿Dónde? = Where?
¿Dónde quiere cenar? = Where do you want to have dinner?
una reservación = a reservation
la situación = the situation
¿Tiene una reservación? = Do you have a reservation?
¿Dónde quiere comer esta noche? = Where do you want to eat tonight?
# CD 2
## -ación, de, tipo
la confirmación = the confirmation
la información = the information
¿Qué tipo de restaurante? = What kind of restaurant?
la confirmación de la reservación = the confirmation of the reservation
¿Qué tipo de información quiere? = What kind of information do you want?
## traducción, por favor, hoy, dar
Necesito una traducción. = I need a translation.
¿Puede hacerlo para mí? = Can you do it for me?
Por favor. = Please.
¿Puede hacerlo hoy, por favor? = Can you do it today, please?
¿Puede dar una explicación? = Can you give an explanation?
## İsimden fiil: -ar
formar = to form
confirmar = to confirm
hablar = to speak
salir = to leave
Quiero confirmar la reservación. = I want to confirm the reservation.
Quiero hablar. = I want to speak.
## aquí; verle, verlos, verme
aquí = here
Quiero verle. = I want to see you.
Quiero verlos. = I want to see them.
¿Puede verme? = Can you see me?
¿Puede hacerlo aquí? = Can you do it here?
## comprender, decir, comprar
¿Puede comprenderme? = Can you understand me?
¿Puede decirme? = Can you tell me?
Quiero comprar algo. = I want to buy something.
¿Por qué no quiere comprarlo? = Why don't you want to buy it?
¿Por qué no puede decirme ahora? = Why can't you tell me now?
## caro, tengo que, salir, pronto
Es muy caro. = It is very expensive.
Tengo que hacerlo. = I have to do it.
Tengo que salir pronto. = I have to leave soon.
Tiene que comprarlo. = You have to buy it.
¿Cuándo tiene que salir? = When do you have to leave?
## -ico; la situación política
lógico = logical
práctico = practical
No es lógico pero es práctico. = It's not logical but it's practical.
la situación económica = the economic situation
¿Qué piensa de la situación política? = What do you think of the political situation?
## ¿cuánto?, si, estoy
¿Cuánto es? = How much is it?
si no es muy caro = if it is not very expensive
Estoy ocupado. = I am busy.
Estoy cansada. = I am tired.
No estoy muy ocupado hoy. = I am not very busy today.
## está, estar, ¿cómo está?
¿Cómo está? = How are you?
¿Dónde está? = Where is it?
¿Está ocupada ahora? = Are you busy now?
Buenos días. = Good morning.
esta casa = this house
## voy a, más tarde
Voy a comer. = I am going to eat.
Voy a comprarlo. = I am going to buy it.
Es muy tarde. = It is very late.
Voy a estar aquí más tarde. = I am going to be here later.
No voy a hacerlo porque es caro. = I'm not going to do it because it's expensive.
# CD 3
## llamar, ¿a qué hora?, va a
Voy a llamarle más tarde. = I am going to call you later.
¿A qué hora? = At what time?
¿A qué hora va a llamarme? = What time are you going to call me?
¿Puede llamarme mañana? = Can you call me tomorrow?
¿Dónde va a estar? = Where are you going to be?
## él, ella, usted
Va a hacerlo. = He is going to do it.
Ella va a estar aquí pronto. = She is going to be here soon.
¿Qué quiere él? = What does he want?
¿Dónde está ella? = Where is she?
¿Qué tiene usted? = What do you have?
## listo
Estoy listo. = I am ready.
¿Está lista? = Are you ready?
¿A qué hora va a estar listo? = What time is it going to be ready?
Quiero saber cuándo va a estar listo. = I want to know when it will be ready.
## todo, nada, mañana
Todo está listo. = Everything is ready.
Nada está listo. = Nothing is ready.
mañana = tomorrow
Todo va a estar listo mañana. = Everything will be ready tomorrow.
No tengo nada. = I have nothing.
## ser ve estar
Es posible. = It is possible.
Está listo. = It is ready.
Soy profesor. = I am a teacher.
No sé. = I don't know.
No sé dónde está. = I don't know where it is.
## ser/estar örnekleri
Pablo está enfermo hoy. = Pablo is sick today.
Ella está bien vestida hoy. = She is well dressed today.
Soy ingeniero. = I am an engineer.
Él es listo. = He is clever.
Ella está lista. = She is ready.
## confirmar, preparar, aceptar, mucho
¿Puede preparar la cena? = Can you prepare dinner?
Quiero aceptar la condición. = I want to accept the condition.
Muchas gracias. = Thank you very much.
Lo siento, no puedo aceptarlo. = I'm sorry, I can't accept it.
## Fiil, sıfat, isim
la situación = the situation
importante = important
preparar = to prepare
aceptar = to accept
entender = to understand
## venir, conmigo
¿Puede venir conmigo? = Can you come with me?
con ella = with her
con usted = with you
¿Puede hablar español conmigo? = Can you speak Spanish with me?
¿Puede venir a verlo esta noche? = Can you come to see it tonight?
## ir, tengo que ir
ir = to go
Quiero ir a verlo. = I want to go to see it.
Tengo que ir. = I have to go.
Tengo que hablar con usted. = I have to talk with you.
No puedo ir hoy porque estoy ocupado. = I can't go today because I'm busy.
# CD 4
## encontrar
No puedo encontrarlo. = I can't find it.
¿Dónde está? No sé. = Where is it? I don't know.
¿Puede decirme dónde está? = Can you tell me where it is?
¿Puede ayudarme a encontrarlo? = Can you help me find it?
## compro, vendo, comprendo
Lo compro. = I'm buying it.
No lo vendo. = I'm not selling it.
Lo comprendo muy bien. = I understand it very well.
¿Me comprende? = Do you understand me?
¿Por qué no lo comprende? = Why don't you understand it?
## escribir, todos los días
Escribo. = I am writing.
Escribo todos los días. = I write every day.
¿Por qué no lo vende? = Why don't you sell it?
Lo vende. = He is selling it.
## me gusta, le gusta
Me gusta. = I like it.
Me gusta mucho. = I like it a lot.
No me gusta hacerlo. = I don't like to do it.
¿Le gusta? = Do you like it?
Me gusta escribir. = I like to write.
## sabe, hace, sale, -iendo
¿Sabe dónde está? = Do you know where it is?
¿Qué hace hoy? = What are you doing today?
¿A qué hora sale? = What time are you leaving?
¿Qué está haciendo? = What are you doing right now?
Estoy saliendo. = I am leaving right now.
## dice, lo que, querer decir
¿Qué dice? = What are you saying?
No comprendo lo que dice. = I don't understand what you are saying.
No es lo que quiero. = It's not what I want.
¿Qué quiere decir? = What do you mean?
No es lo que quiero decir. = That's not what I mean.
## İki ray: -ar ve -er/-ir
hablo = I speak
Lo preparo. = I'm preparing it.
Lo acepto. = I accept it.
¿Habla inglés? = Do you speak English?
Escribe. = He writes.
## quién, nadie, todo el mundo
¿Quién habla español? = Who speaks Spanish?
Nadie habla inglés aquí. = Nobody speaks English here.
Todo el mundo lo sabe. = Everybody knows it.
¿Por qué no habla español conmigo? = Why don't you speak Spanish with me?
## Onlar: -n
Hablan. = They speak.
Comprenden. = They understand.
Lo hacen. = They are doing it.
Lo compran. = They are buying it.
No lo venden. = They are not selling it.
## Siz (çoğul): -n
¿Por qué no lo venden? = Why don't you all sell it?
¿Por qué no lo hacen? = Why don't you all do it?
¿Hablan español? = Do you all speak Spanish?
¿Qué quieren? = What do you all want?
# CD 5
## Şimdiki zaman tekrarı
Comprendo. = I understand.
No comprendo. = I don't understand.
Quiere. = He wants.
Puedo. = I can.
Comprenden. = They understand.
¿No me comprende? = Don't you understand me?
## voy, estoy, soy, doy, sé
voy = I go
estoy = I am (state)
soy = I am (identity)
doy = I give
sé = I know
## venden, compran
No lo compran. = They are not buying it.
¿Por qué no lo compran? = Why don't you all buy it?
Lo venden hoy. = They are selling it today.
## tú; emir kipi
¿Hablas inglés? = Do you speak English?
¿Por qué no hablas conmigo? = Why don't you talk with me?
¡Hable español conmigo! = Speak Spanish with me!
¿Qué quieres? = What do you want?
## este, ese, esto
este libro = this book
esa mesa = that table
Quiero ver esto. = I want to see this.
¡Compre ese libro! = Buy that book!
¡No lo compre! = Don't buy it!
## Olumsuz emir
¡No lo venda! = Don't sell it!
¡No lo vendas! = Don't sell it! (to a friend)
¡No lo vendan! = Don't sell it! (to several people)
No lo compre, no es bueno. = Don't buy it, it's not good.
## Olumlu emir: zamir sona

function score(v,pref){ let s=0; const n=v.name.toLowerCase();

  const u=new SpeechSynthesisUtterance(text), my=++token;
  const v=pickVoice(lang); if(v) u.voice=v; u.lang=v?v.lang:(lang==="es"?"es-ES":"en-US");
  u.rate=S.rate; u.pitch=1;
  let fired=false;
  const after=()=>{ if(fired||my!==token) return; fired=true; clearTimeout(timer); P.ph++;
    const g=GAPS[S.gap]; timer=setTimeout(speakNext,P.ph%2===0&&S.order!=="pair"?g[0]:g[0]); };
  u.onend=after; u.onerror=e=>{ if(e.error==="interrupted"||e.error==="canceled") return; after(); };
  synth.cancel(); synth.speak(u);
  // iOS bazen onend göndermez: metin uzunluğuna göre yedek zamanlayıcı
  timer=setTimeout(after, 2500 + text.length*95/S.rate);
}
function highlight(lang){ $("#cEs").classList.toggle("speaking",lang==="es"); $("#cEn").classList.toggle("speaking",lang==="en"); }
function pause(){ playing=false; token++; clearTimeout(timer); synth&&synth.cancel(); if(P)P.ph=0; highlight(""); ui(); }
function toggle(){ if(playing) return pause(); if(!P){ const l=LS.get("last"); if(l&&course(l.c)) return start(l.c,l.d,l.t,l.p); return start("foundation",0,0,0);} playing=true; P.ph=0; speakNext(); ui(); keepAwake(); }
function jumpPair(dir){ if(!P) return; const x=cur(); token++; synth&&synth.cancel(); clearTimeout(timer);
  P.p=Math.max(0,P.p+dir); P.ph=0;
  if(P.p>=x.t.pairs.length) return nextTrack(playing);
  save(); ui(); if(playing) timer=setTimeout(speakNext,250); }
function nextTrack(autoplay,dir=1){
  const c=course(P.c); let d=P.d,t=P.t+dir;
  if(t>=c.discs[d].tracks.length){ d++; t=0; }
  if(t<0){ d--; if(d<0){d=0;t=0;} else t=c.discs[d].tracks.length-1; }
  if(d>=c.discs.length){ pause(); toast(`${FULL[c.id]} bitti! Sıradaki kursa geçebilirsin 🎉`,4000); return; }
  P={c:P.c,d,t,p:0,ph:0}; save(); ui(); if(autoplay){ playing=true; toast(c.discs[d].tracks[t].title,1800); timer=setTimeout(speakNext,1500); }
}
async function keepAwake(){ try{ if("wakeLock" in navigator && !wake){ wake=await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>wake=null);} }catch{} }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&playing) keepAwake(); });

/* ---------- arayüz ---------- */
function ui(){
  const x=cur(); $("#mini").hidden=!x; if(!x) return;
  const pp=playing?ICON.pause:ICON.play;
  $("#miniPP").innerHTML=pp(26); $("#bPlay").innerHTML=pp(54);
  $("#miniT").textContent=x.pair?x.pair[0]:x.t.title;
  $("#miniS").textContent=`${FULL[x.c.id]} · ${x.d.label} · ${x.t.title}`;
  $("#miniProg").style.width=((P.p)/x.t.pairs.length*100)+"%";
  $("#cWhere").textContent=`${FULL[x.c.id]} · ${x.d.label} · ${P.t+1}. bölüm`;
  $("#cLesson").textContent=x.t.title;
  $("#cEs").textContent=x.pair?x.pair[0]:""; $("#cEn").textContent=x.pair?x.pair[1]:"";
  $("#cDots").innerHTML=x.t.pairs.map((_,i)=>`<i class="${i<P.p?"d":i===P.p?"c":""}"></i>`).join("");
  $("#bPrev").innerHTML=ICON.back+"<span>Tekrar / önceki</span>";
  $("#bNext").innerHTML=ICON.fwd+"<span>Sonraki cümle</span>";
  document.querySelectorAll(".trk.now").forEach(e=>e.classList.remove("now"));
  const el=document.querySelector(`.trk[data-k="${tKey(P.c,P.d,P.t)}"]`); if(el) el.classList.add("now");
}
function stats(c){ let tot=0,f=0,pairs=0; c.discs.forEach((d,di)=>d.tracks.forEach((t,ti)=>{tot++;pairs+=t.pairs.length;if(done.has(tKey(c.id,di,ti)))f++;})); return {tot,f,pairs}; }

function renderHome(){
  $("#hdr").innerHTML=`<span class="stripe" aria-hidden="true"></span><h1>Español en el Coche</h1>`;
  const l=LS.get("last"); let res="";
  if(l&&course(l.c)){ const c=course(l.c),d=c.discs[l.d],t=d&&d.tracks[l.t];
    if(t) res=`<button class="resume" id="resume"><span class="ic">${ICON.play(28)}</span><span><small>Kaldığın yer · ${FULL[c.id]} ${esc(d.label)} · ${l.t+1}. bölüm, ${l.p+1}. cümle</small><b>${esc(t.title)}</b></span></button>`; }
  const vopts=lang=>{ const list=VOICES.filter(v=>v.lang.toLowerCase().startsWith(lang)); const p=pickVoice(lang);
    return list.length?list.map(v=>`<option value="${esc(v.voiceURI)}" ${p&&v.voiceURI===p.voiceURI?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join(""):`<option>Ses bulunamadı</option>`; };
  const opt=(k,arr)=>arr.map(([v,l])=>`<option value="${v}" ${String(S[k])===String(v)?"selected":""}>${l}</option>`).join("");
  $("#app").innerHTML=`<div class="stack">${res}</div>
  <h2>Sıfırdan öğrenme sırası</h2>
  <div class="stack">${COURSES.map(c=>{const s=stats(c),pct=Math.round(s.f/s.tot*100);
    return `<button class="course" data-go="${c.id}"><span class="n" style="background:${COLORS[c.id]}">${c.step}</span><span class="txt"><b>${FULL[c.id]}</b><p>${esc(c.note)}</p><span class="bar"><i style="width:${pct}%"></i></span><span class="meta">${s.f}/${s.tot} bölüm bitti · ${s.pairs} cümle</span></span></button>`}).join("")}</div>
  <h2>Okuma ayarları</h2>
  <div class="settings">
    <div class="set"><label for="sOrder">Okuma düzeni</label><select id="sOrder">${opt("order",[["pair","İspanyolca → İngilizce, tekrar"],["block","İspanyolca ×2, sonra İngilizce ×2"],["enfirst","İngilizce önce (Michel tarzı)"]])}</select></div>
    <div class="set"><label for="sReps">Tekrar sayısı</label><select id="sReps">${opt("reps",[[1,"1 kez"],[2,"2 kez"],[3,"3 kez"]])}</select></div>
    <div class="set"><label for="sRate">Hız<small>Normalin biraz altı önerilir</small></label><select id="sRate">${opt("rate",[[0.8,"Sakin"],[0.9,"Biraz yavaş"],[1,"Normal"]])}</select></div>
    <div class="set"><label for="sGap">Cümle arası duraklama<small>Uzun: cevabı sen söyle</small></label><select id="sGap">${opt("gap",[["short","Kısa"],["normal","Normal"],["long","Uzun"]])}</select></div>
    <div class="set"><label for="sEs">İspanyolca ses</label><select id="sEs">${vopts("es")}</select></div>
    <div class="set"><label for="sEn">İngilizce ses</label><select id="sEn">${vopts("en")}</select></div>
    <div class="set"><label>Sesleri dene</label><button class="test" id="tryV">▶ Dinle</button></div>
  </div>
  <h2>Bilmen gerekenler</h2>
  <div class="stack">
    <div class="note"><b>Arabada:</b> Uygulama ekranda açık kalsın. Telefon kilitlenirse iPhone seslendirmeyi durdurur. Uygulama açıkken ekranı uyanık tutmaya çalışır; yine de kararırsa Ayarlar → Ekran ve Parlaklık → Otomatik Kilit → Asla seç.</div>
    <div class="note"><b>Daha doğal ses için:</b> iPhone Ayarlar → Erişilebilirlik → Seslendirilen İçerik → Sesler → İspanyolca → "Mónica (Gelişmiş)" ya da "Paulina (Gelişmiş)" indir. Sonra burada seç.</div>
    <div class="note"><b>Diğer PDF'ler:</b> Total Spanish = Foundation + Vocabulary başı · Masterclass = Language Builder · Start/Introductory = Foundation'ın başı. Hepsi bu dört kursun içinde.</div>
  </div>`;
  const a=$("#app");
  a.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>location.hash=b.dataset.go);
  const r=$("#resume"); if(r) r.onclick=()=>{ start(l.c,l.d,l.t,l.p); $("#car").hidden=false; };
  const bind=(id,k,num)=>$(id).onchange=e=>{S[k]=num?+e.target.value:e.target.value;saveS();};
  bind("#sOrder","order"); bind("#sReps","reps",1); bind("#sRate","rate",1); bind("#sGap","gap"); bind("#sEs","esVoice"); bind("#sEn","enVoice");
  $("#tryV").onclick=()=>{ if(!synth) return toast("Seslendirme desteklenmiyor"); pause(); synth.cancel();
    const a1=new SpeechSynthesisUtterance("Hola, ¿cómo estás? Vamos a aprender español."); const v1=pickVoice("es"); if(v1){a1.voice=v1;a1.lang=v1.lang;} else a1.lang="es-ES"; a1.rate=S.rate;
    const a2=new SpeechSynthesisUtterance("Hello, how are you? Let's learn Spanish."); const v2=pickVoice("en"); if(v2){a2.voice=v2;a2.lang=v2.lang;} else a2.lang="en-US"; a2.rate=S.rate;
    synth.speak(a1); synth.speak(a2); };
}

function renderCourse(c){
  $("#hdr").innerHTML=`<button class="back" id="back" aria-label="Geri">‹</button><h1>${FULL[c.id]}</h1>`;
  $("#back").onclick=()=>location.hash="";
  $("#app").innerHTML=`<div class="stack"><div class="note">${esc(c.note)} Bir bölüme dokun, okumaya başlasın; bitince sıradaki bölüme kendisi geçer.</div>
  ${c.discs.map((d,di)=>`<section class="disc"><div class="disc-h"><b>${esc(d.label)}</b><span>${d.tracks.length} bölüm</span><button class="playall" data-d="${di}">▶ Baştan</button></div>
    ${d.tracks.map((t,ti)=>{const k=tKey(c.id,di,ti),on=done.has(k);
      return `<button class="trk" data-k="${k}" data-d="${di}" data-t="${ti}"><span class="num">${ti+1}</span><span class="t">${esc(t.title)}<span>${esc(t.pairs.map(p=>p[0]).join(" · "))}</span></span><span class="ck ${on?"on":""}">${on?"✓":""}</span></button>`}).join("")}</section>`).join("")}</div>`;
  const a=$("#app");
  a.querySelectorAll(".trk").forEach(b=>b.onclick=()=>{ start(c.id,+b.dataset.d,+b.dataset.t,0); $("#car").hidden=false; });
  a.querySelectorAll(".playall").forEach(b=>b.onclick=()=>{ start(c.id,+b.dataset.d,0,0); $("#car").hidden=false; });
  ui();
}
function route(){ const h=location.hash.slice(1); const c=course(h); c?renderCourse(c):renderHome(); window.scrollTo(0,0); ui(); }

$("#miniOpen").onclick=e=>{ if(e.target.closest("#miniPP")) return toggle(); $("#car").hidden=false; };
$("#carClose").onclick=()=>{ $("#car").hidden=true; route(); };
$("#bPlay").onclick=toggle;
$("#bPrev").onclick=()=>jumpPair(P&&P.ph>0?0:-1);
$("#bNext").onclick=()=>jumpPair(1);
$("#bPrevT").onclick=()=>{ if(!P) return; token++; synth&&synth.cancel(); clearTimeout(timer); nextTrack(playing,-1); };
$("#bNextT").onclick=()=>{ if(!P) return; token++; synth&&synth.cancel(); clearTimeout(timer); nextTrack(playing,1); };
window.addEventListener("hashchange",route);
// iOS'ta uzun okumalarda motorun takılmasını önle
setInterval(()=>{ if(playing&&synth&&synth.paused) synth.resume(); },5000);

const l0=LS.get("last"); if(l0&&course(l0.c)){ P={c:l0.c,d:l0.d,t:l0.t,p:l0.p,ph:0}; }
route();
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body></html>
